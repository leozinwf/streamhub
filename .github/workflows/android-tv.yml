name: APK Fire TV

# Gera o APK do StreamHub para Fire TV / Android TV.
# - Em todo push que mexe no app: o APK fica em "Artifacts" na página da execução.
# - Quando uma release é publicada (ex.: pelo "Publicar nova versao.bat"): o APK é anexado nela.
on:
  push:
    branches: [main, firestick-apk]
    paths: ['src/**', 'public/**', 'android/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', '.github/workflows/android-tv.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Front-end (vite build)
        run: |
          npm ci --no-audit --no-fund
          npx vite build
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r dist android/app/src/main/assets/web

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.STREAMHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamhub-tv.jks"
            echo "STREAMHUB_KEYSTORE_PATH=$RUNNER_TEMP/streamhub-tv.jks" >> "$GITHUB_ENV"
            echo "Usando a chave oficial."
          else
            echo "Sem secrets: usando a chave de teste do repositório."
          fi

      - name: APK
        working-directory: android
        env:
          STREAMHUB_KEYSTORE_PASSWORD: ${{ secrets.STREAMHUB_KEYSTORE_PASSWORD }}
          STREAMHUB_KEY_ALIAS: ${{ secrets.STREAMHUB_KEY_ALIAS }}
          STREAMHUB_KEY_PASSWORD: ${{ secrets.STREAMHUB_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: StreamHub-FireTV
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Anexar à release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nome fixo também, para o link curto no app Downloader do Fire TV:
          # https://github.com/leozinwf/streamhub/releases/latest/download/StreamHub-FireTV.apk
          cp android/app/build/outputs/apk/release/StreamHub-FireTV-*.apk "$RUNNER_TEMP/StreamHub-FireTV.apk"
          gh release upload "${{ github.event.release.tag_name }}" android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/StreamHub-FireTV.apk" --clobber

  # Teste rápido num emulador Android (só no branch de desenvolvimento do app de TV):
  # instala o APK, abre o app e confere o servidor local e o proxy de streams.
  smoke-test:
    if: github.ref == 'refs/heads/firestick-apk'
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamHub-FireTV
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/*.apk
            adb shell am start -n com.streamhub.tv/.MainActivity
            sleep 20
            adb forward tcp:51730 tcp:51730
            echo "== health"; curl -sS -m 10 http://127.0.0.1:51730/api/health; echo
            echo "== index"; curl -sS -m 10 http://127.0.0.1:51730/ | head -c 300; echo
            echo "== playlist"; curl -sS -m 30 -o /tmp/pl.txt -w "%{http_code} %{size_download}\n" "http://127.0.0.1:51730/api/playlist?url=https%3A%2F%2Fiptv-org.github.io%2Fiptv%2Fcountries%2Fbr.m3u"; head -3 /tmp/pl.txt
            echo "== stream manifest"; curl -sS -m 30 "http://127.0.0.1:51730/api/stream?url=https%3A%2F%2Ftest-streams.mux.dev%2Fx36xhzz%2Fx36xhzz.m3u8" | head -8
            echo "== stream segment"; SEG=$(curl -sS -m 30 "http://127.0.0.1:51730/api/stream?url=https%3A%2F%2Ftest-streams.mux.dev%2Fx36xhzz%2Furl_0%2F193039199_mp4_h264_aac_hd_7.m3u8" | grep -v '^#' | head -1); echo "$SEG"; curl -sS -m 30 -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "$SEG"
            echo "== xtream (sem credenciais)"; curl -sS -m 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:51730/api/xtream; echo
            pip install --quiet --break-system-packages pillow 2>/dev/null || pip install --quiet pillow
            shot() { adb exec-out screencap -p > /tmp/shot.png; python3 -c "from PIL import Image; im=Image.open('/tmp/shot.png').convert('RGB'); im.thumbnail((800,450)); im.save('/tmp/shot.jpg', quality=55)"; echo "== SCREENSHOT $1"; base64 -w0 /tmp/shot.jpg; echo; }
            key() { adb shell input keyevent "$1"; sleep 1.5; }
            shot inicio
            echo "== importar M3U pelo controle"
            key KEYCODE_DPAD_DOWN; key KEYCODE_DPAD_DOWN; key KEYCODE_DPAD_DOWN
            shot foco-no-campo
            adb shell input text "https://raw.githubusercontent.com/leozinwf/streamhub/firestick-apk/android/test/teste.m3u"; sleep 1
            key KEYCODE_ENTER; sleep 6
            shot home
            key KEYCODE_DPAD_DOWN; key KEYCODE_DPAD_DOWN
            shot foco-cartao
            key KEYCODE_DPAD_CENTER; sleep 20
            shot assistindo
            key KEYCODE_BACK; sleep 2
            shot depois-do-voltar
            echo "== logcat"; adb logcat -d | grep -E "StreamHub|AndroidRuntime|FATAL" | tail -80

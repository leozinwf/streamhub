import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// A versão do APK acompanha a do package.json (ex.: 0.2.5 -> versionName "0.2.5", versionCode 205).
def packageJson = new JsonSlurper().parse(file('../../package.json'))
def appVersion = packageJson.version as String
def (major, minor, patch) = appVersion.tokenize('.-').take(3).collect { it.isInteger() ? it.toInteger() : 0 }
def appVersionCode = major * 10000 + minor * 100 + patch

// Assinatura: com os secrets STREAMHUB_KEYSTORE_* usa a chave oficial. Sem eles, usa a chave de teste
// fixa do repositório (android/debug.keystore), para que cada APK novo instale por cima do anterior.
def keystorePath = System.getenv('STREAMHUB_KEYSTORE_PATH')

android {
    namespace 'com.streamhub.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.streamhub.tv'
        minSdk 22
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('STREAMHUB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STREAMHUB_KEY_ALIAS')
                keyPassword System.getenv('STREAMHUB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "StreamHub-FireTV-${appVersion}.apk"
        }
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
